  <!-- the start animation (intro.js) plays on every load of the home, not with reduced motion and not when the Site
       Manager switched it off (<html data-intro="off">); set before the first paint, so the home never shows for a
       moment first -->
  <script>
    try {
      if (document.documentElement.dataset.intro !== 'off' && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('intro-on');
    } catch {}

  <style>
    /* "cobalt print": ink and paper like a risograph print. Cobalt is the one ink for fills (and the reel's
       duotone), coral the small second ink for marks. Same tokens in sub.css and legal.html */
    :root {
      --bg: #0d0e11;
      --panel: #18191d;
      --line: #26272c;
      --text: #eeeae0;
      --muted: #a3a09a;
      --signal: #2f5bff;
      --on-signal: #ffffff;
      --coral: #ff6b57;
      --edge: clamp(20px, calc(16vw - 60px), 220px);
      --expo: cubic-bezier(0.16, 1, 0.3, 1);
      --mono: "Fira Mono", ui-monospace, Menlo, Consolas, monospace;
      --nav: 72px;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
    }
    ::selection {
      background: var(--signal);
      color: var(--on-signal);
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    a:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 4px;
      border-radius: 4px;
    }

    /* one screen: the reel in a large frame under the menu, a thin footer line under it */
    .home {
      box-sizing: border-box;
      height: 100%;
      padding: var(--nav) var(--edge) 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
    }

    /* the frame: endless Nurture-style scribble lines (nurture-lines.js) zooming into depth, rendered at a third of the
       resolution and scaled up without smoothing, so they read as pixels. A soft darker middle on top, so the words read.
       Corners: 24 like the folder cards' rim */
    .reel {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      background: #0a0b0d;
      isolation: isolate;
    }
    .reel-lines {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      pointer-events: none;
    }
    .reel::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      background: radial-gradient(60% 55% at 0% 22%, rgb(10 11 13 / 0.6), rgb(10 11 13 / 0.1));
      pointer-events: none;
    }
    /* the sentence about Eric, small and quiet in the frame's top left corner: the first sentence in ink, the rest
       a step back in muted */
    .reel-in {
      position: absolute;
      inset: 0;
      z-index: 3;
      box-sizing: border-box;
      padding: clamp(32px, 20vh, 200px) clamp(20px, 2.2vw, 40px) 0;
      pointer-events: none;
    }
    .intro {
      max-width: 21em;
      margin: 0;
      font: 400 clamp(17px, 1.25vw, 22px)/1.32 "DM Sans", sans-serif;
      letter-spacing: -0.018em;
      color: var(--muted);
      text-wrap: pretty;
      pointer-events: auto;
    }
    .intro-lead {
      color: var(--text);
    }
    /* bottom left: every project by name, uppercase, packed tight in columns like a credit list */
    .hero-projects {
      position: absolute;
      left: clamp(20px, 2.2vw, 40px);
      bottom: clamp(20px, 3.4vh, 40px);
      right: clamp(20px, 2.2vw, 40px);
      pointer-events: auto;
    }
    .hero-projects ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(var(--rows, 6), auto);
      justify-content: start;
      column-gap: clamp(24px, 3.4vw, 56px);
      font: 600 clamp(10px, 0.78vw, 13px)/1.32 Unbounded, "DM Sans", sans-serif;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }
    .hero-projects li {
      white-space: nowrap;
    }
    .hero-projects a {
      color: var(--coral);
      transition: color 0.2s;
    }
    .hero-projects a:hover {
      color: var(--text);
    }
    .hero-projects a.more {
      color: var(--text);
    }
    .hero-projects a.more:hover {
      color: var(--coral);
    }
    .stuff {
      color: var(--coral);
      text-decoration: none;
      transition: color 0.3s;
    }
    .stuff:hover {
      color: #ff8a7a;
    }

    /* the one moment on load: the frame opens from a line across its middle, then the words */
    @media (prefers-reduced-motion: no-preference) {
      .reel {
        animation: reel-open 1.2s var(--expo) 0.1s both;
      }
      .intro {
        animation: fade-in 1.2s var(--expo) 0.7s both;
      }
      .hero-projects {
        animation: fade-in 1.2s var(--expo) 0.9s both;
      }
    }
    @keyframes reel-open {
      from { clip-path: inset(49% 0 49% 0 round 24px); }
      to { clip-path: inset(0 0 0 0 round 24px); }
    }
    @keyframes fade-in {
      from { opacity: 0; translate: 0 10px; }
    }

    /* phones: a smaller gutter, the words a touch larger for reading */
    @media (max-width: 760px) {
      :root { --nav: 60px; }
      .home {
        padding: var(--nav) 12px 0;
      }
      .reel {
        border-radius: 20px;
      }
      .reel-in {
        padding: clamp(28px, 12vh, 96px) 20px 0;
      }
      .intro {
        font-size: clamp(17px, 4.6vw, 20px);
      }
      .hero-projects ul {
        font-size: 9.5px;
      }
    }
  </style>

  <script type="module">
    import { loopMark } from './logo-build.js';
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    // the frame's background: endless scribble lines (a still frame with reduced motion). Loaded on its own, so the
    // page still works if three.js can't be fetched
    import('./nurture-lines.js')
      .then(({ mountNurtureLines }) => mountNurtureLines(document.querySelector('.reel'), {
        background: '#0a0b0d',
        clear: document.querySelector('.intro'),   // lines dim behind the sentence so it stays readable
      }))
      .catch((e) => console.warn('nurture lines:', e));
    // the menu's logo goes round its loop once per visit, not again on every page change
    let seen = false;
    try { seen = sessionStorage.getItem('iameric-logo') === '1'; sessionStorage.setItem('iameric-logo', '1'); } catch {}
    if (!still && !seen) loopMark(document.querySelector('.nav-home .mark-logo'));

    // bottom left: the newest projects by name (projects.js plus the tools, like the projects page), in columns of 6.
    // At most 18 on wide screens (three columns) and 12 on phones (one column); when there are more, the last
    // place says "+ N more" and leads to the projects page
    const phone = matchMedia('(max-width: 760px)');
    let all = [];
    const item = (text, more, page) => {
      const li = document.createElement('li'), a = document.createElement('a');
      a.href = page || 'projects.html';   // a project with its own page leads there
      a.textContent = text;
      if (more) a.className = 'more';
      li.append(a);
      return li;
    };
    const renderProjects = () => {
      const ul = document.querySelector('.hero-projects ul');
      const max = phone.matches ? 12 : 18;
      const shown = all.length > max ? all.slice(0, max - 1) : all;
      const items = shown.map(p => item(p.title, false, p.page && `work/${p.id}/`));
      if (shown.length < all.length) items.push(item(`+ ${all.length - shown.length} more`, true));
      ul.replaceChildren(...items);
      ul.style.setProperty('--rows', phone.matches ? items.length : 6);
    };
    import('./projects.js').then(async ({ PROJECTS }) => {
      const { TOOLS } = await import('./tools.js');
      all = [...PROJECTS.filter(p => !p.hidden), ...TOOLS.filter(t => !t.hidden).map(t => ({ title: t.title, date: t.date }))]
        .sort((a, b) => String(b.date).localeCompare(String(a.date)));
      renderProjects();
    });
    phone.addEventListener('change', renderProjects);
  </script>
  <script>
    // launched in 2026: show "2026" that year, "2026 – <current year>" afterwards
    const LAUNCH = 2026, thisYear = new Date().getFullYear();
    document.querySelectorAll('.year').forEach(el => {
      el.textContent = thisYear > LAUNCH ? `${LAUNCH} – ${thisYear}` : String(LAUNCH);
    });
  </script>
